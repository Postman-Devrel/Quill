$kind: http-request
name: "Current user"
method: GET
url: "{{confluence_base}}/rest/api/user/current"
order: 1000
headers:
  - key: "Accept"
    value: "application/json"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Token resolves to an Atlassian account', () => pm.expect(body.accountId).to.be.a('string'));
