$kind: http-request
name: "Unauthenticated request is rejected"
method: GET
url: "{{confluence_base}}/rest/api/user/current"
order: 6000
headers:
  - key: "Accept"
    value: "application/json"
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401 or 403', () => pm.expect(pm.response.code).to.be.oneOf([401, 403]));
