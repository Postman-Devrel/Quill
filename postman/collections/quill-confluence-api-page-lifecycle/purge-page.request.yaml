$kind: http-request
name: "Purge page from trash (cleanup)"
method: DELETE
url: "{{confluence_base}}/rest/api/content/{{confluence_test_page_id}}?status=trashed"
order: 5000
queryParams:
  - key: "status"
    value: "trashed"
headers:
  - key: "Accept"
    value: "application/json"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.expect(pm.response.code).to.eql(204));
