$kind: http-request
name: "Delete page (to trash)"
method: DELETE
url: "{{confluence_base}}/rest/api/content/{{confluence_test_page_id}}"
order: 4000
headers:
  - key: "Accept"
    value: "application/json"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 204', () => pm.expect(pm.response.code).to.eql(204));
