$kind: http-request
name: "Search terms (30 days)"
method: GET
url: "{{stats_base}}/stats/search-terms?period=day&num=30&date={{stats_end}}&max=100&summarize=1"
order: 5000
queryParams:
  - key: "period"
    value: "day"
  - key: "num"
    value: "30"
  - key: "date"
    value: "{{stats_end}}"
  - key: "max"
    value: "100"
  - key: "summarize"
    value: "1"
headers:
  - key: "User-Agent"
    value: "{{wp_user_agent}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('search_terms array and encrypted count present', () => { pm.expect(body.summary.search_terms).to.be.an('array'); pm.expect(body.summary.encrypted_search_terms).to.be.a('number'); });
