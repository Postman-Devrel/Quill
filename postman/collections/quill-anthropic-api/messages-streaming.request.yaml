$kind: http-request
name: "Messages - streaming (SSE)"
method: POST
url: "{{anthropic_base}}/v1/messages"
order: 3000
headers:
  - key: "anthropic-version"
    value: "2023-06-01"
  - key: "content-type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "model": "{{anthropic_fast_model}}",
      "max_tokens": 16,
      "stream": true,
      "messages": [{"role": "user", "content": "Reply with the single word: ok"}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      pm.test('Content-Type is text/event-stream', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('text/event-stream'));
      const text = pm.response.text();
      pm.test('Stream starts with message_start', () => pm.expect(text).to.include('event: message_start'));
      pm.test('Stream contains content deltas', () => pm.expect(text).to.include('event: content_block_delta'));
      pm.test('Stream terminates with message_stop', () => pm.expect(text).to.include('event: message_stop'));
