$kind: http-request
name: "Messages - unknown model returns 404"
method: POST
url: "{{anthropic_base}}/v1/messages"
order: 5000
headers:
  - key: "anthropic-version"
    value: "2023-06-01"
  - key: "content-type"
    value: "application/json"
body:
  type: json
  content: |-
    {
      "model": "quill-nonexistent-model",
      "max_tokens": 16,
      "messages": [{"role": "user", "content": "hi"}]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 404', () => pm.response.to.have.status(404));
      const body = pm.response.json();
      pm.test('Error envelope is not_found_error', () => pm.expect(body.error.type).to.eql('not_found_error'));
