$kind: http-request
name: "Share doc: anyone with link"
method: POST
url: "{{drive_base}}/files/{{drive_test_file_id}}/permissions"
order: 4000
headers:
  - key: "Content-Type"
    value: "application/json"
body:
  type: json
  content: |-
    {"type": "anyone", "role": "writer"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Permission created', () => { pm.expect(body.id).to.be.a('string'); pm.expect(body.type).to.eql('anyone'); });
