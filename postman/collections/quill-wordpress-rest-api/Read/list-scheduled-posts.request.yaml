$kind: http-request
name: "List scheduled posts (find-next-wp-slot)"
method: GET
url: "{{wp_base}}/posts?status=future&per_page=5&orderby=date&order=asc&_fields=id,date,title"
order: 4000
queryParams:
  - key: "status"
    value: "future"
  - key: "per_page"
    value: "5"
  - key: "orderby"
    value: "date"
  - key: "order"
    value: "asc"
  - key: "_fields"
    value: "id,date,title"
headers:
  - key: "User-Agent"
    value: "{{wp_user_agent}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Returns an array', () => pm.expect(body).to.be.an('array'));
      pm.test('Scheduled posts carry a date', () => body.forEach((p) => pm.expect(p.date).to.match(/^\d{4}-\d{2}-\d{2}T/)));
