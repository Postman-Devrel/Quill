$kind: http-request
name: "Authenticated user (users/me)"
method: GET
url: "{{wp_base}}/users/me"
order: 1000
headers:
  - key: "User-Agent"
    value: "{{wp_user_agent}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Credentials resolve to a user', () => pm.expect(body.id).to.be.a('number'));
