$kind: http-request
name: "Delete draft (cleanup)"
method: DELETE
url: "{{wp_base}}/posts/{{wp_test_post_id}}?force=true"
order: 4000
queryParams:
  - key: "force"
    value: "true"
headers:
  - key: "User-Agent"
    value: "{{wp_user_agent}}"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Permanently deleted', () => pm.expect(body.deleted).to.eql(true));
