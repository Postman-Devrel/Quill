$kind: http-request
name: "Get issue (update-jira-ticket read)"
method: GET
url: "{{jira_base}}/rest/api/3/issue/{{jira_issue_key}}?fields=summary,description"
order: 4000
queryParams:
  - key: "fields"
    value: "summary,description"
headers:
  - key: "Accept"
    value: "application/json"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Issue has key and summary', () => { pm.expect(body.key).to.eql(pm.collectionVariables.get('jira_issue_key')); pm.expect(body.fields.summary).to.be.a('string'); });
