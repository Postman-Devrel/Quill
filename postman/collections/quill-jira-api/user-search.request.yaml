$kind: http-request
name: "User search (assignee resolution)"
method: GET
url: "{{jira_base}}/rest/api/3/user/search?query=pooja"
order: 2000
queryParams:
  - key: "query"
    value: "pooja"
headers:
  - key: "Accept"
    value: "application/json"
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Array of users with accountId and displayName', () => { pm.expect(body).to.be.an('array'); body.forEach((x) => { pm.expect(x.accountId).to.be.a('string'); pm.expect(x.displayName).to.be.a('string'); }); });
