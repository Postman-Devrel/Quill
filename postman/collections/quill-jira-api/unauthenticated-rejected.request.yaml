$kind: http-request
name: "Unauthenticated request is rejected"
method: GET
url: "{{jira_base}}/rest/api/3/myself"
order: 7000
headers:
  - key: "Accept"
    value: "application/json"
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 401', () => pm.expect(pm.response.code).to.eql(401));
