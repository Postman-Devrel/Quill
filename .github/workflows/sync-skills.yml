name: Sync devrel skills

on:
  schedule:
    # Mondays 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Run sync script
        run: scripts/sync-skills.sh

      - name: Open PR if skills changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Sync skills from devrel-claude-code-skills"
          title: "Sync skills from devrel-claude-code-skills"
          body: |
            Automated sync of `skills/blog-copyeditor`, `skills/blog-ideas`, and `skills/blog-write`
            from [Postman-Devrel/devrel-claude-code-skills](https://github.com/Postman-Devrel/devrel-claude-code-skills).

            Review the diff before merging — this updates skills used by the deployed agent.
          branch: sync-devrel-skills
          delete-branch: true
          add-paths: skills/
          reviewers: pmmistry
